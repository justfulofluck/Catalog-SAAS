version: '3.8'

services:
  # Your Vite React TypeScript application
  catalog-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-studio-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:3000 || curl -f http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # localhost.run tunnel service
  tunnel:
    image: alpine:latest
    container_name: catalog-app-tunnel
    command: |
      sh -c "
        apk add --no-cache openssh-client wget curl &&
        echo '🚀 Starting localhost.run tunnel for Catalog Studio App...'
        echo '⏳ Waiting for app to be ready...'
        sleep 15
        echo '🌐 Creating tunnel - your public URL will appear below...'
        ssh -R 80:catalog-app:3000 ssh.localhost.run \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ServerAliveInterval=60 \
          -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes
      "
    networks:
      - app-network
    depends_on:
      catalog-app:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge