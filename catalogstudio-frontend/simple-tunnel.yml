version: '3.8'

services:
  # Simple tunnel service that connects to localhost.run directly
  tunnel:
    image: alpine:latest
    container_name: catalog-app-tunnel
    command: |
      sh -c "
        apk add --no-cache openssh-client &&
        echo '🚀 Starting localhost.run tunnel...'
        echo '🌐 This will tunnel port 3000 from your host machine'
        echo '⏳ Make sure your app is running on http://localhost:3000'
        echo ''
        echo '📊 Your public URL will appear below:'
        ssh -R 80:host.docker.internal:3000 ssh.localhost.run \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ServerAliveInterval=60 \
          -o ServerAliveCountMax=3
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    network_mode: "bridge"